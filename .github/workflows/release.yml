# Releases non-beta versions, without 'beta*' suffix
name: Release
on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: .NET Info
        run: dotnet --info

      - name: README.md
        run: |
          # Removes tags <sub> and </sub>
          sed -i 's/<\/\?sub>//g' README.md
          # Replaces relative GitHub paths with NuGet-friendly absolute URLs
          sed -i 's|/.github/ocelot_icon.png|https://raw.githubusercontent.com/ThreeMammals/Ocelot.Testing/main/.github/ocelot_icon.png|g' README.md
          echo "::group::New content of README.md"
          cat README.md
          echo "::endgroup::"
      - name: Install tools
        run: |
          TOOLS="libxml2-utils xmlstarlet jq"
          COMMANDS="xmllint xmlstarlet jq"

          echo "::group::Installing tools..."
          sudo apt-get update
          sudo apt-get install -y $TOOLS
          echo "::endgroup::"

          echo "::group::Checking tools availability..."
          for cmd in $COMMANDS; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "::error::$cmd is not installed"
              exit 1
            fi
            "$cmd" --version >/dev/null 2>&1 || {
              echo "::error::$cmd is present but not functional"
              exit 1
            }
            echo "OK: $cmd -> $(command -v "$cmd")"
          done
          echo "::endgroup::"

          echo "::group::Getting latest release via curl/jq tools..."
          curl --silent "https://api.github.com/repos/ThreeMammals/Ocelot/releases/latest" | jq -r .tag_name
          echo "::endgroup::"
      - name: Read XML
        id: xml
        run: |
          xml_value=$(xmllint --xpath "string(//Project/PropertyGroup/Version)" ./src/Ocelot.Testing.csproj)
          echo "Version: $xml_value"
          echo "Version=$xml_value" >> $GITHUB_OUTPUT
          xml_value=$(xmllint --xpath "string((//Project/ItemGroup)[2]/PackageReference[@Include='Ocelot']/@Version)" ./src/Ocelot.Testing.csproj)
          echo "Ocelot Ref Ver: $xml_value"
          echo "OcelotRefVer=$xml_value" >> $GITHUB_OUTPUT
          oc_latest_release=$(curl -s "https://api.github.com/repos/ThreeMammals/Ocelot/releases/latest" | jq -r .tag_name) # # | grep -o '"tag_name": *"[^"]*"' | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/'
          echo "Ocelot Ver: $oc_latest_release"
          echo "OcelotVer=$oc_latest_release" >> $GITHUB_OUTPUT
          if [[ "$xml_value" != "$oc_latest_release" ]]; then
            echo "::error::Mismatch: Ocelot Reference ver from project file is not equal to Ocelot Latest Release tag! -> '$xml_value' != '$oc_latest_release'"
            exit 1
          fi
      - name: Replace Version
        id: ver
        run: |
          echo "Version: ${{ steps.xml.outputs.Version }}"
          echo "Ocelot Ver: ${{ steps.xml.outputs.OcelotVer }}"
          echo "Ocelot Ref Ver: ${{ steps.xml.outputs.OcelotRefVer }}"
          s_Version="${{ steps.xml.outputs.Version }}"
          if [[ "$s_Version" == *-* ]]; then
            echo "Version contains '-'"
            first_part=$(echo "$s_Version" | cut -d'-' -f1)
            echo "First part: $first_part"
            new_value=$first_part
          else
            new_value=$s_Version
          fi
          echo "Going to replace version $s_Version -> $new_value"
          xmlstarlet ed -L -u "//Project/PropertyGroup/Version" -v "$new_value" ./src/Ocelot.Testing.csproj
          xml_value=$(xmllint --xpath "string(//Project/PropertyGroup/Version)" ./src/Ocelot.Testing.csproj)
          echo "Replaced Version: $xml_value"
          echo "PkgVersion=$xml_value" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore ./Ocelot.Testing.slnx
      - name: Pack project
        run: dotnet pack ./src/Ocelot.Testing.csproj --configuration Release --output ./packages /p:ContinuousIntegrationBuild=true
      - name: Publish to GitHub Packages
        run: dotnet nuget push ./packages/*.nupkg --source "https://nuget.pkg.github.com/ThreeMammals/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
      - name: Publish to NuGet
        run: dotnet nuget push ./packages/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      # - name: Find assets
      #   id: assets
      #   run: |
      #     echo "ASSETS=$(find packages/*.* -print | tr '\n' ' ')" >> $GITHUB_OUTPUT
      #     echo "ASSETS=$(find packages/ -name '*.*pkg' -printf '%f\n')"
      # - name: Use files in another step
      #   run: |
      #     echo "Files found: ${{ steps.assets.outputs.ASSETS }}"
      - name: Check GitHub Release
        id: check_release
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — skipping publish."
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist — will publish."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        if: steps.check_release.outputs.exists == '0'
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.PkgVersion }}
          OCELOT_VERSION: ${{ steps.xml.outputs.OcelotVer }}
        with:
          # tag_name: 24.0.2 # Name of a tag. defaults to github.ref_name
          body: |
            ## Version [${{ env.PACKAGE_VERSION }}](https://www.nuget.org/packages/Ocelot.Testing/${{ env.PACKAGE_VERSION }})
            - Ocelot package: v[${{ env.OCELOT_VERSION }}](https://www.nuget.org/packages/Ocelot/${{ env.OCELOT_VERSION }})
            - Ocelot release: [${{ env.OCELOT_VERSION }}](https://github.com/ThreeMammals/Ocelot/releases/tag/${{ env.OCELOT_VERSION }})
          files: |
            packages/*.*pkg
          draft: false
          prerelease: false
