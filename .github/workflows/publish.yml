# Publishes beta-versions only
name: Publish
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: README.md
        run: |
          echo "::group::Original README.md"
          cat README.md
          echo "::endgroup::"
          echo ------------------------
          # Removes tags <sub> and </sub>
          sed -i 's/<\/\?sub>//g' README.md
          # Replaces relative GitHub paths with NuGet-friendly absolute URLs
          sed -i 's|/.github/ocelot_icon.png|https://raw.githubusercontent.com/ThreeMammals/Ocelot.Testing/main/.github/ocelot_icon.png|g' README.md
          echo "::group::New content of README.md"
          cat README.md
          echo "::endgroup::"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: .NET Info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore ./Ocelot.Testing.slnx

      - name: Pack project
        run: dotnet pack ./src/Ocelot.Testing.csproj --configuration Release --output ./packages /p:ContinuousIntegrationBuild=true

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./packages/*.nupkg --source "https://nuget.pkg.github.com/ThreeMammals/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Publish to NuGet
        run: dotnet nuget push ./packages/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ secrets.NUGET_API_KEY_2025 }} --skip-duplicate
